# ============================================================
# Kervansaray - Docker Compose iskeleti
# ------------------------------------------------------------
# CILEKAI'nin compose iskeletinden tasindi (PROJECT_BRIEF S13).
# Cikarilanlar (PROJECT_BRIEF S10 / S12):
#   - ollama        : model asla sunucuda calismaz, LLM bulut API uzerinden
#   - anythingllm   : ayri RAG platformu gereksiz
#   - qdrant/pgvector: vektor DB gereksiz, Postgres yerel FTS ve SQL
# ============================================================

services:
  app:
    container_name: kervansaray_app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://kervansaray:${POSTGRES_PASSWORD:-kervansaray}@db:5432/kervansaray
      - PORT=8000
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  # Postgres: olay deposu ve notlar (PROJECT_BRIEF S10). Sadece localhost'a acilir.
  db:
    image: postgres:16-alpine
    container_name: kervansaray_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kervansaray
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kervansaray}
      - POSTGRES_DB=kervansaray
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kervansaray_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kervansaray -d kervansaray"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kervansaray_db:

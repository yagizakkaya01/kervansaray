name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kervansaray
          POSTGRES_PASSWORD: kervansaray
          POSTGRES_DB: kervansaray_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kervansaray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kervansaray:kervansaray@localhost:5432/kervansaray_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: alembic upgrade (sema)
        run: alembic upgrade head
      - name: pytest
        run: pytest -q

  eval:
    # ROADMAP Faz 3: altin set + eval harness. Beklenen tool cagrilarini
    # sentetik DB'ye karsi kosar, tek dogruluk sayisi raporlar (PROJECT_BRIEF S9).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kervansaray
          POSTGRES_PASSWORD: kervansaray
          POSTGRES_DB: kervansaray_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kervansaray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kervansaray:kervansaray@localhost:5432/kervansaray_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: eval (altin set)
        run: python -m eval
